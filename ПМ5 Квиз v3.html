<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПМ5 Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f2f7;
  --card:#ffffff;
  --border:#e2e6ef;
  --blue:#3b6ef8;
  --blue2:#1a4ad4;
  --green:#16a34a;
  --red:#dc2626;
  --yellow:#f59e0b;
  --text:#1a1f36;
  --muted:#6b7280;
  --light:#f8f9fc;
  --shadow:0 2px 16px rgba(59,110,248,.10);
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Onest',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;}
.app{max-width:700px;margin:0 auto;}

/* HEADER */
.header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding:14px 18px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);}
.logo-icon{width:38px;height:38px;background:var(--blue);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.logo-text{font-size:15px;font-weight:700;color:var(--text);}
.logo-sub{font-size:12px;color:var(--muted);margin-top:1px;}
.header-right{margin-left:auto;text-align:right;}
.q-counter{font-size:13px;font-weight:700;color:var(--blue);}
.q-total{font-size:11px;color:var(--muted);}

/* MODE BAR */
.mode-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.mode-btn{flex:1;min-width:80px;padding:9px 8px;background:var(--card);border:1.5px solid var(--border);border-radius:10px;font-family:'Onest',sans-serif;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;}
.mode-btn:hover{border-color:var(--blue);color:var(--blue);}
.mode-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;}

/* STATS ROW */
.stats{display:flex;gap:10px;margin-bottom:16px;}
.stat{flex:1;background:var(--card);border-radius:12px;padding:12px;text-align:center;box-shadow:var(--shadow);}
.stat-v{font-size:22px;font-weight:800;}
.stat-l{font-size:11px;color:var(--muted);font-weight:500;margin-top:1px;}
.s-done .stat-v{color:var(--blue);}
.s-ok .stat-v{color:var(--green);}
.s-bad .stat-v{color:var(--red);}
.s-pct .stat-v{color:var(--yellow);}

/* PROGRESS */
.prog-wrap{background:var(--border);border-radius:99px;height:6px;margin-bottom:16px;overflow:hidden;}
.prog-bar{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),#7cb3ff);transition:width .4s ease;}

/* QUESTION CARD */
.q-card{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:14px;animation:slideUp .25s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.q-label{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--blue);background:#eef2ff;padding:4px 10px;border-radius:99px;margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px;}
.q-text{font-size:16px;font-weight:600;line-height:1.6;color:var(--text);}

/* DIAGRAM */
.diagram-wrap{margin-top:14px;background:var(--light);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;}
.diagram-title{font-size:11px;font-weight:700;color:var(--muted);padding:8px 14px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.5px;}
.diagram-wrap canvas,.diagram-wrap svg{display:block;width:100%;max-height:180px;}

/* OPTIONS */
.options{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;}
.opt{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--border);border-radius:12px;padding:13px 16px;cursor:pointer;transition:all .15s;text-align:left;width:100%;font-family:'Onest',sans-serif;}
.opt:hover:not(:disabled){border-color:var(--blue);background:#f0f4ff;}
.opt-key{width:28px;height:28px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--blue);flex-shrink:0;border:1.5px solid var(--border);}
.opt-text{font-size:14px;font-weight:500;color:var(--text);line-height:1.45;}
.opt.correct{border-color:var(--green);background:#f0fdf4;}
.opt.correct .opt-key{background:#dcfce7;color:var(--green);border-color:var(--green);}
.opt.wrong{border-color:var(--red);background:#fef2f2;}
.opt.wrong .opt-key{background:#fee2e2;color:var(--red);border-color:var(--red);}

/* EXPLANATION */
.explain-card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px;border-left:4px solid var(--blue);animation:slideUp .3s ease;display:none;}
.explain-card.show{display:block;}
.explain-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.explain-icon{width:28px;height:28px;border-radius:8px;background:#eef2ff;display:flex;align-items:center;justify-content:center;font-size:14px;}
.explain-title{font-size:13px;font-weight:700;color:var(--blue);}
.explain-body{font-size:14px;line-height:1.7;color:var(--text);}
.explain-loading{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}

/* CONTROLS */
.controls{display:flex;gap:10px;margin-bottom:20px;}
.btn-next{flex:1;padding:15px;background:var(--blue);color:#fff;border:none;border-radius:12px;font-family:'Onest',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;}
.btn-next:hover:not(:disabled){background:var(--blue2);}
.btn-next:disabled{opacity:.35;cursor:default;}
.btn-shuffle{padding:15px 18px;background:var(--card);border:2px solid var(--border);border-radius:12px;font-family:'Onest',sans-serif;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;}
.btn-shuffle:hover{border-color:var(--blue);color:var(--blue);}

/* KEYBOARD HINT */
.kb{text-align:center;font-size:11px;color:var(--muted);margin-bottom:16px;}
.kb span{background:var(--card);padding:2px 7px;border-radius:5px;border:1px solid var(--border);margin:0 2px;font-weight:600;}

/* RESULTS */
.results{display:none;background:var(--card);border-radius:var(--radius);padding:40px 24px;text-align:center;box-shadow:var(--shadow);}
.results.show{display:block;animation:slideUp .3s ease;}
.r-emoji{font-size:64px;margin-bottom:12px;}
.r-title{font-size:22px;font-weight:800;margin-bottom:6px;}
.r-score{font-size:72px;font-weight:800;background:linear-gradient(135deg,var(--blue),#7cb3ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:10px 0;}
.r-msg{color:var(--muted);font-size:14px;margin-bottom:28px;line-height:1.6;}
.r-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.btn-r{padding:12px 24px;border:none;border-radius:12px;font-family:'Onest',sans-serif;font-size:14px;font-weight:700;cursor:pointer;}
.btn-r.primary{background:var(--blue);color:#fff;}
.btn-r.secondary{background:var(--bg);color:var(--text);border:2px solid var(--border);}

@media(max-width:480px){
  .q-text{font-size:14px;}
  .opt-text{font-size:13px;}
  .stats{gap:6px;}
  .stat-v{font-size:18px;}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo-icon">🌐</div>
    <div>
      <div class="logo-text">ПМ5 Quiz</div>
      <div class="logo-sub">Сети и ОС · Т23-3В</div>
    </div>
    <div class="header-right">
      <div class="q-counter" id="q-counter">1 / 360</div>
      <div class="q-total" id="q-total-lbl">360 вопросов</div>
    </div>
  </div>

  <div class="mode-bar">
    <button class="mode-btn active" onclick="setMode('all')">Все 400</button>
    <button class="mode-btn" onclick="setMode('wrong')">❌ Ошибки</button>
    <button class="mode-btn" onclick="setMode('r20')">🎲 20</button>
    <button class="mode-btn" onclick="setMode('r50')">🎲 50</button>
    <button class="mode-btn" onclick="setMode('r100')">🎲 100</button>
  </div>

  <div class="stats">
    <div class="stat s-done"><div class="stat-v" id="s-tot">0</div><div class="stat-l">отвечено</div></div>
    <div class="stat s-ok"><div class="stat-v" id="s-ok">0</div><div class="stat-l">верно</div></div>
    <div class="stat s-bad"><div class="stat-v" id="s-bad">0</div><div class="stat-l">ошибок</div></div>
    <div class="stat s-pct"><div class="stat-v" id="s-pct">—</div><div class="stat-l">точность</div></div>
  </div>

  <div class="prog-wrap"><div class="prog-bar" id="prog" style="width:0%"></div></div>

  <div class="q-card" id="q-card">
    <div class="q-label">🔢 <span id="q-num">Вопрос 1</span></div>
    <div class="q-text" id="q-text">Загрузка...</div>
    <div id="diagram-container"></div>
  </div>

  <div class="options" id="options"></div>

  <div class="explain-card" id="explain-card">
    <div class="explain-header">
      <div class="explain-icon">💡</div>
      <div class="explain-title">Объяснение от ИИ</div>
    </div>
    <div class="explain-body" id="explain-body">
      <div class="explain-loading"><div class="spinner"></div> Думаю...</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-shuffle" onclick="startQuiz()">↺ Заново</button>
    <button class="btn-next" id="btn-next" onclick="nextQ()" disabled>Следующий →</button>
  </div>

  <div class="kb">Клавиши: <span>A</span><span>B</span><span>C</span><span>D</span> — ответ · <span>Enter</span> — следующий</div>

  <div class="results" id="results">
    <div class="r-emoji" id="r-emoji">🎉</div>
    <div class="r-title">Квиз завершён!</div>
    <div class="r-score" id="r-score">0%</div>
    <div class="r-msg" id="r-msg"></div>
    <div class="r-btns">
      <button class="btn-r primary" onclick="startQuiz()">↺ Заново</button>
      <button class="btn-r secondary" onclick="setMode('wrong')">Повторить ошибки</button>
    </div>
  </div>
</div>

// --- Visual diagrams ---
function getDiagram(q){
  const qt=q.q+' '+q.ans;
  if(/коммутатор|switch|MAC.таблиц|канальный уровень|VLAN|trunk|access.порт|STP|широковещательный домен/i.test(qt)){
    return drawSwitch;
  }
  if(/маршрутизатор|routing|маршрут|шлюз|сетевой уровень|OSPF|BGP|ACL|NAT|traceroute/i.test(qt)){
    return drawRouter;
  }
  if(/OSI|уровн/i.test(qt)){
    return drawOSI;
  }
  if(/IPv4|маска|подсеть|адрес сети|broadcast|\/24|\/25|\/30|192\.168|172\.16|10\./i.test(qt)){
    return drawSubnet;
  }
  if(/SSH|Telnet|консол|VTY|crypto|RSA/i.test(qt)){
    return drawSSH;
  }
  if(/DHCP/i.test(qt)){
    return drawDHCP;
  }
  if(/DNS/i.test(qt)){
    return drawDNS;
  }
  if(/TCP|UDP|порт 22|порт 23|порт 53|порт 67/i.test(qt)){
    return drawTCP;
  }
  return null;
}

function makeCanvas(w,h){
  const c=document.createElement('canvas');
  c.width=w;c.height=h;
  c.style.width='100%';c.style.maxHeight=h+'px';
  return c;
}

function drawBox(ctx,x,y,w,h,label,bg='#dbeafe',fg='#1e40af'){
  ctx.fillStyle=bg;ctx.strokeStyle=fg;ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(x,y,w,h,8);ctx.fill();ctx.stroke();
  ctx.fillStyle=fg;ctx.font='bold 13px Onest,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(label,x+w/2,y+h/2);
}
function arrow(ctx,x1,y1,x2,y2,label='',col='#6b7280'){
  ctx.strokeStyle=col;ctx.lineWidth=2;ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1);
  ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-10*Math.cos(a-0.4),y2-10*Math.sin(a-0.4));ctx.lineTo(x2-10*Math.cos(a+0.4),y2-10*Math.sin(a+0.4));ctx.closePath();ctx.fill();
  if(label){ctx.fillStyle='#374151';ctx.font='11px Onest,sans-serif';ctx.textAlign='center';ctx.fillText(label,(x1+x2)/2,(y1+y2)/2-8);}
}

// --- State ---
let queue=[],idx=0,correct=0,wrong=0,answered=false,mode='all';
let wrongSet=new Set();
let shuffledOpts=[];

function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;}

function setMode(m){
  mode=m;
  document.querySelectorAll('.mode-btn').forEach((b,i)=>{
    b.classList.toggle('active',['all','wrong','r20','r50','r100'][i]===m);
  });
  startQuiz();
}

function startQuiz(){
  let pool;
  if(mode==='all') pool=[...ALL];
  else if(mode==='wrong'){pool=[...wrongSet].map(i=>ALL[i]);if(!pool.length)pool=[...ALL];wrongSet.clear();}
  else if(mode==='r20') pool=shuffle(ALL).slice(0,20);
  else if(mode==='r50') pool=shuffle(ALL).slice(0,50);
  else pool=shuffle(ALL).slice(0,100);
  queue=shuffle(pool);
  shuffledOpts=queue.map(q=>shuffle(q.opts));
  idx=0;correct=0;wrong=0;
  document.getElementById('results').classList.remove('show');
  document.getElementById('q-card').style.display='';
  document.getElementById('options').style.display='';
  document.querySelector('.controls').style.display='';
  document.querySelector('.kb').style.display='';
  document.getElementById('explain-card').classList.remove('show');
  document.getElementById('q-total-lbl').textContent=queue.length+' вопросов';
  updateStats();renderQ();
}

function renderQ(){
  if(idx>=queue.length){showResults();return;}
  answered=false;
  const q=queue[idx];
  const opts=shuffledOpts[idx];
  document.getElementById('q-num').textContent='Вопрос '+(idx+1);
  document.getElementById('q-counter').textContent=(idx+1)+' / '+queue.length;
  document.getElementById('q-text').textContent=q.q;
  document.getElementById('explain-card').classList.remove('show');
  document.getElementById('btn-next').disabled=true;

  // Diagram
  const dc=document.getElementById('diagram-container');
  dc.innerHTML='';
  const fn=getDiagram(q);
  if(fn){
    const wrap=document.createElement('div');wrap.className='diagram-wrap';
    const title=document.createElement('div');title.className='diagram-title';title.textContent='📊 Схема';
    wrap.appendChild(title);fn(wrap);dc.appendChild(wrap);
  }

  // Options
  const cont=document.getElementById('options');cont.innerHTML='';
  const labels=['A','B','C','D'];
  opts.forEach((text,i)=>{
    const btn=document.createElement('button');btn.className='opt';
    btn.innerHTML=`<span class="opt-key">${labels[i]}</span><span class="opt-text">${text}</span>`;
    btn.onclick=()=>answer(btn,text,q);
    cont.appendChild(btn);
  });

  // Progress
  const pct=Math.round(idx/queue.length*100);
  document.getElementById('prog').style.width=pct+'%';
}

async function answer(btn,selected,q){
  if(answered)return;
  answered=true;
  const isOk=selected===q.ans;
  if(isOk){correct++;btn.classList.add('correct');}
  else{
    wrong++;btn.classList.add('wrong');
    document.querySelectorAll('.opt').forEach(b=>{
      if(b.querySelector('.opt-text').textContent===q.ans)b.classList.add('correct');
    });
    const oi=ALL.findIndex(x=>x.q===q.q);
    if(oi!==-1)wrongSet.add(oi);
  }
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  document.getElementById('btn-next').disabled=false;
  updateStats();
  // Show AI explanation
  await showExplanation(q,isOk);
}

async function showExplanation(q,isOk){
  const card=document.getElementById('explain-card');
  const body=document.getElementById('explain-body');
  card.style.borderLeftColor=isOk?'var(--green)':'var(--red)';
  body.innerHTML='<div class="explain-loading"><div class="spinner"></div> ИИ объясняет...</div>';
  card.classList.add('show');

  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system:'Ты преподаватель сетевых технологий. Отвечай ТОЛЬКО на русском. Объяснение должно быть простым, как студенту — 2-4 предложения максимум. Используй аналогии из жизни. Если есть команда Cisco или Linux — покажи её. Никаких заголовков и форматирования markdown.',
        messages:[{role:'user',content:`Вопрос: "${q.q}"\nПравильный ответ: "${q.ans}"\n\nОбъясни почему это правильный ответ просто и понятно. Помоги студенту запомнить, а не зазубрить.`}]
      })
    });
    const data=await resp.json();
    const text=data.content?.map(c=>c.text||'').join('')||'Не удалось получить объяснение.';
    body.innerHTML=text.replace(/\n/g,'<br>');
  }catch(e){
    body.innerHTML='💡 <b>'+q.ans+'</b> — правильный ответ. Подключись к интернету для подробного объяснения от ИИ.';
  }
}

function nextQ(){idx++;renderQ();}

function updateStats(){
  const t=correct+wrong;
  document.getElementById('s-tot').textContent=t;
  document.getElementById('s-ok').textContent=correct;
  document.getElementById('s-bad').textContent=wrong;
  document.getElementById('s-pct').textContent=t?Math.round(correct/t*100)+'%':'—';
}

function showResults(){
  document.getElementById('q-card').style.display='none';
  document.getElementById('options').style.display='none';
  document.querySelector('.controls').style.display='none';
  document.querySelector('.kb').style.display='none';
  document.getElementById('explain-card').classList.remove('show');
  const r=document.getElementById('results');r.classList.add('show');
  const pct=Math.round(correct/queue.length*100);
  document.getElementById('r-score').textContent=pct+'%';
  let emoji,msg;
  if(pct>=90){emoji='🏆';msg='Отлично! Стипендия твоя 💪';}
  else if(pct>=75){emoji='🎯';msg='Хорошо! Ещё немного — и будет отлично.';}
  else if(pct>=60){emoji='📚';msg='Неплохо. Нажми "Повторить ошибки"!';}
  else{emoji='💪';msg='Жми "Повторить ошибки" — там твои слабые места. Не сдавайся!';}
  document.getElementById('r-emoji').textContent=emoji;
  document.getElementById('r-msg').textContent=correct+' из '+queue.length+' правильно · '+msg;
  document.getElementById('prog').style.width='100%';
}

// Keyboard
document.addEventListener('keydown',e=>{
  const map={a:'A',b:'B',c:'C',d:'D','1':'A','2':'B','3':'C','4':'D'};
  const k=map[e.key.toLowerCase()];
  if(k&&!answered){
    const btns=document.querySelectorAll('.opt');
    ['A','B','C','D'].forEach((lbl,i)=>{if(lbl===k&&btns[i])btns[i].click();});
  }
  if((e.key==='Enter'||e.key==='ArrowRight')&&!document.getElementById('btn-next').disabled)nextQ();
});

startQuiz();
</script>
